services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
        KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
        KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_USE_FIREBASE_EMULATORS: ${NEXT_PUBLIC_USE_FIREBASE_EMULATORS:-false}
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        GEMINI_MODEL: ${GEMINI_MODEL}
        FIREBASE_ADMIN_PROJECT_ID: ${FIREBASE_ADMIN_PROJECT_ID}
        FIREBASE_ADMIN_CLIENT_EMAIL: ${FIREBASE_ADMIN_CLIENT_EMAIL}
        FIREBASE_ADMIN_PRIVATE_KEY: ${FIREBASE_ADMIN_PRIVATE_KEY}
    image: fun-learning:local
    container_name: fun-learning
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    # Makes `localhost` resolve to the host machine from inside this
    # container (Docker's portable host-gateway mechanism). This is what
    # lets KEYCLOAK_ISSUER be a single plain http://localhost:8180/... value
    # that works both for the browser (genuinely localhost) and for this
    # container's own server-side token/discovery requests (which would
    # otherwise need a different hostname — see docs/architecture.md).
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - firebase-emulator
      - keycloak
    restart: unless-stopped

  # Local-only Firestore + Storage emulator — see Dockerfile.emulator for
  # why this exists (Firebase now requires the Blaze plan for real Storage,
  # even at $0 usage). Only actually used by the app when
  # NEXT_PUBLIC_USE_FIREBASE_EMULATORS=true; harmless to leave running
  # otherwise (the app just won't talk to it).
  firebase-emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
      args:
        FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-demo-fun-learning}
    image: fun-learning-firebase-emulator:local
    container_name: fun-learning-firebase-emulator
    ports:
      - "8080:8080" # Firestore
      - "9199:9199" # Storage
      - "4000:4000" # Emulator UI — open http://localhost:4000 to inspect data
    restart: unless-stopped

  # Local Keycloak for testing the real OIDC flow (not just the /help demo
  # account bypass). Realm/client/test-user auto-imported from
  # keycloak/realm-export.json on first start. Port 8180 (not Keycloak's
  # default 8080) because the Firestore emulator already owns 8080 above.
  # KC_HOSTNAME is fixed to "localhost" so every token Keycloak issues has a
  # consistent `iss` claim regardless of which network path reached it —
  # see docs/architecture.md for why this matters and how extra_hosts above
  # makes that true from inside the app container too.
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: fun-learning-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"
    restart: unless-stopped
