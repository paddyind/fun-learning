name: CI

# Cloud validation only — runs on GitHub-hosted runners, never touches any
# local machine. Uses placeholder env values (not secrets) since this only
# validates that the app compiles; it never calls Keycloak/Firebase/Gemini.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch/PR cancels the previous run instead of
# queuing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYCLOAK_CLIENT_ID: ci-placeholder
  KEYCLOAK_CLIENT_SECRET: ci-placeholder
  KEYCLOAK_ISSUER: http://localhost:8080/realms/ci-placeholder
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-placeholder-secret
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
  GEMINI_API_KEY: ci-placeholder
  GEMINI_MODEL: gemini-2.5-flash
  FIREBASE_ADMIN_PROJECT_ID: ci-placeholder
  FIREBASE_ADMIN_CLIENT_EMAIL: ci-placeholder@ci-placeholder.iam.gserviceaccount.com
  FIREBASE_ADMIN_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nci-placeholder\n-----END PRIVATE KEY-----\n"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (validation only, not pushed anywhere)
        run: |
          docker build \
            --build-arg KEYCLOAK_CLIENT_ID="$KEYCLOAK_CLIENT_ID" \
            --build-arg KEYCLOAK_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" \
            --build-arg KEYCLOAK_ISSUER="$KEYCLOAK_ISSUER" \
            --build-arg NEXTAUTH_URL="$NEXTAUTH_URL" \
            --build-arg NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID" \
            --build-arg GEMINI_API_KEY="$GEMINI_API_KEY" \
            --build-arg GEMINI_MODEL="$GEMINI_MODEL" \
            --build-arg FIREBASE_ADMIN_PROJECT_ID="$FIREBASE_ADMIN_PROJECT_ID" \
            --build-arg FIREBASE_ADMIN_CLIENT_EMAIL="$FIREBASE_ADMIN_CLIENT_EMAIL" \
            --build-arg FIREBASE_ADMIN_PRIVATE_KEY="$FIREBASE_ADMIN_PRIVATE_KEY" \
            -t fun-learning:ci .
